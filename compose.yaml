

services:
  chatbot:
    image: shantanu36/agentic-ai-chatbot:latest
    container_name: agentic-ai-chatbot

    ports:
      - "8080:8080"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  chatbot-test:
    profiles:
      - test
    image: shantanu36/agentic-ai-chatbot:health-test
    container_name: agentic-ai-chatbot-compose-test

    ports:
      - "8082:8080"

    env_file:
      - .env

    volumes:
      - ./docker-test/data:/app/data
      - ./docker-test/chroma_db:/app/chroma_db
      - ./docker-test/uploads:/app/uploads

    restart: "no"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
